<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Course Feedback - Metaverse Edition 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }

        /* Metaverse Background */
        .metaverse-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-screen.hide {
            display: none;
        }

        .login-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .login-subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .google-signin-btn {
            background: white;
            color: #333;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .google-signin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header with Avatar */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #667eea;
        }

        .points-display {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2em;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Avatar Path */
        .avatar-path {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .path-line {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            border-radius: 2px;
        }

        .avatar-walker {
            position: absolute;
            top: 50%;
            left: 5%;
            transform: translate(-50%, -50%) scaleX(-1);
            font-size: 3em;
            transition: left 0.5s ease;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        .checkpoint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border: 3px solid white;
            transition: all 0.3s;
        }

        .checkpoint.completed {
            background: #4caf50;
            box-shadow: 0 0 20px #4caf50;
        }

        /* Question Card */
        .question-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            text-align: center;
            color: #fff;
        }

        .question-points {
            text-align: center;
            color: #ffd700;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        /* Flip Cards */
        .flip-card-container {
            perspective: 1000px;
            height: 200px;
            margin-bottom: 20px;
        }

        .flip-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            padding: 20px;
            text-align: center;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .flip-card-back {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            transform: rotateY(180deg);
        }

        /* Swipe Cards */
        .swipe-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
        }

        .swipe-card {
            position: absolute;
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 30px;
            padding: 40px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, opacity 0.3s;
        }

        .swipe-card:active {
            cursor: grabbing;
        }

        .swipe-card h3 {
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .swipe-card p {
            font-size: 1.2em;
            text-align: center;
            opacity: 0.9;
        }

        .swipe-indicators {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            transform: translateY(-50%);
        }

        .swipe-indicator {
            font-size: 4em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .swipe-indicator.show {
            opacity: 1;
        }

        .swipe-help {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            opacity: 0.8;
        }

        /* Drag and Drop Ranking */
        .ranking-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rank-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            cursor: move;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .rank-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        .rank-item.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .rank-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.2em;
        }

        .rank-label {
            flex: 1;
            font-size: 1.1em;
        }

        .drag-handle {
            font-size: 1.5em;
            opacity: 0.5;
        }

        /* Spinning Wheel */
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 10px solid rgba(255, 255, 255, 0.3);
            position: relative;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(
                from 0deg,
                #667eea 0deg 72deg,
                #764ba2 72deg 144deg,
                #f093fb 144deg 216deg,
                #ffd93d 216deg 288deg,
                #6bcf7f 288deg 360deg
            );
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .wheel-pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ffd700;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .wheel-options {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .wheel-option {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2em;
        }

        .spin-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .wheel-result {
            font-size: 1.5em;
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .wheel-result.show {
            opacity: 1;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .nav-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .nav-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .nav-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Thank You Screen */
        .thank-you-screen {
            display: none;
            text-align: center;
            padding: 60px;
        }

        .thank-you-screen.show {
            display: block;
        }

        .trophy {
            font-size: 8em;
            animation: bounce 1s ease-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .final-points {
            font-size: 3em;
            margin: 30px 0;
            color: #ffd700;
        }

        .thank-you-message {
            font-size: 1.5em;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .question-card {
                padding: 25px;
            }

            .wheel {
                width: 250px;
                height: 250px;
            }

            .swipe-card {
                height: 300px;
                padding: 25px;
            }
        }

        /* Helpfulness Meter Styles */
        .helpfulness-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .topic-meter {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .topic-name {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meter-track {
            position: relative;
            height: 40px;
            background: linear-gradient(90deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            border-radius: 20px;
            overflow: hidden;
        }

        .meter-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            transition: width 0.3s;
            backdrop-filter: blur(5px);
        }

        .meter-slider {
            position: relative;
            width: 100%;
            margin-top: 10px;
        }

        .meter-slider input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: transparent;
            outline: none;
            -webkit-appearance: none;
        }

        .meter-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #667eea;
        }

        .meter-slider input[type="range"]::-moz-range-thumb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #667eea;
        }

        .meter-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .meter-value {
            text-align: center;
            margin-top: 10px;
            font-size: 1.5em;
            font-weight: 700;
            color: #ffd700;
        }

        /* Pace Slider Styles */
        .pace-slider-container {
            padding: 30px;
        }

        .pace-track {
            position: relative;
            height: 60px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 33%, #43e97b 66%, #38f9d7 100%);
            border-radius: 30px;
            margin: 30px 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .pace-indicator {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            transition: left 0.3s;
            filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.3));
        }

        .pace-labels-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .pace-label {
            text-align: center;
            flex: 1;
        }

        .pace-label-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .pace-label-text {
            font-size: 1.1em;
            opacity: 0.7;
            transition: all 0.3s;
        }

        .pace-label.active .pace-label-text {
            opacity: 1;
            font-weight: 700;
            font-size: 1.3em;
            color: #ffd700;
        }

        .pace-slider-input {
            width: 100%;
            margin-top: 20px;
        }

        .pace-slider-input input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 10px;
            background: linear-gradient(90deg, #4facfe, #43e97b, #38f9d7);
            outline: none;
            -webkit-appearance: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .pace-slider-input input[type="range"]:hover {
            opacity: 1;
        }

        .pace-slider-input input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 4px solid #667eea;
        }

        .pace-slider-input input[type="range"]::-moz-range-thumb {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 4px solid #667eea;
        }
    
    </style>
</head>
<body>
    <!-- Metaverse Background -->
    <div class="metaverse-bg" id="metaverseBg"></div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-title">🌌 Blockchain Feedback Portal</div>
            <div class="login-subtitle">Enter the Metaverse to share your experience</div>
            <button class="google-signin-btn" onclick="handleGoogleSignIn()">
                <span>🔐</span>
                <span>Sign in with Google</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <img src="" alt="User" class="user-avatar" id="userAvatar">
                <div>
                    <div style="font-size: 1.2em; font-weight: 600;" id="userName">Loading...</div>
                    <div style="opacity: 0.8;" id="userEmail"></div>
                </div>
            </div>
            <div class="points-display" id="pointsDisplay">
                ⭐ 0 Points
            </div>
        </div>

        <!-- Avatar Path -->
        <div class="avatar-path">
            <div class="path-line"></div>
            <div class="avatar-walker" id="avatarWalker">🚶</div>
            <div class="checkpoint" style="left: 5%;" data-checkpoint="0"></div>
            <div class="checkpoint" style="left: 21%;" data-checkpoint="1"></div>
            <div class="checkpoint" style="left: 37%;" data-checkpoint="2"></div>
            <div class="checkpoint" style="left: 53%;" data-checkpoint="3"></div>
            <div class="checkpoint" style="left: 69%;" data-checkpoint="4"></div>
            <div class="checkpoint" style="left: 85%;" data-checkpoint="5"></div>
        </div>

        <!-- Questions Container -->
        <div id="questionsContainer"></div>

        <!-- Thank You Screen -->
        <div class="thank-you-screen" id="thankYouScreen">
            <div class="trophy">🏆</div>
            <div class="final-points" id="finalPoints">You earned 0 points!</div>
            <div class="thank-you-message">
                Your feedback has been saved to your account!<br>
                Thank you for helping us improve the Blockchain course! 🔗
            </div>
        </div>
    </div>

    <script>
        // Google Sign-In Configuration
        const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID_HERE'; // Replace with your actual Client ID
        const GOOGLE_SHEET_ID = 'YOUR_SHEET_ID_HERE'; // Replace with your Google Sheet ID
        const GOOGLE_API_KEY = 'YOUR_API_KEY_HERE'; // Replace with your API key

        let currentUser = null;
        let totalPoints = 0;
        let currentQuestionIndex = 0;

        // Store form responses
        const formResponses = {
            q1_excitement: null,
            q2_modules: [],
            q3_instructor: null,
            q4_pace: null,
            q5_ranking: [],
            q6_helpfulness: {}
        };

        // Questions configuration with points
        const questions = [
            {
                type: 'flip',
                question: 'Click to reveal your first question!',
                hiddenQuestion: 'How excited were you to learn Blockchain?',
                points: 10
            },
            {
                type: 'swipe',
                question: 'Swipe the cards: Right = Liked, Left = Needs Work',
                cards: [
                    'Smart Contracts Module',
                    'Solidity Programming',
                    'Web3 Integration',
                    'DeFi Concepts',
                    'NFT Development'
                ],
                points: 15
            },
            {
                type: 'stars',
                question: 'Rate your instructor 👨‍🏫',
                subtitle: 'Click the stars to rate',
                points: 15
            },
            {
                type: 'pace',
                question: 'How was the course pace? 🏃‍♂️',
                subtitle: 'Slide to indicate if the course was too slow, just right, or too fast',
                points: 15
            },
            {
                type: 'ranking',
                question: 'Drag to rank: Most helpful topic at top, least at bottom',
                items: [
                    'Smart Contracts',
                    'Blockchain Basics',
                    'Cryptography',
                    'Consensus Mechanisms',
                    'DApps Development'
                ],
                points: 20
            },
            {
                type: 'helpfulness',
                question: 'Rate how helpful each topic was for you 📊',
                topics: [
                    { name: '⛓️ Blockchain Fundamentals', icon: '⛓️' },
                    { name: '📜 Smart Contracts', icon: '📜' },
                    { name: '💻 Solidity Programming', icon: '💻' },
                    { name: '🌐 Web3 & DApps', icon: '🌐' },
                    { name: '💰 DeFi & Tokenomics', icon: '💰' }
                ],
                points: 25
            }
        ];

        // Initialize Metaverse Background
        function initMetaverse() {
            const bg = document.getElementById('metaverseBg');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';

        // Swipe Cards
        function createSwipeCards(parent, question) {
            const container = document.createElement('div');
            container.className = 'swipe-container';

            const uniqueId = 'swipe-' + Date.now();
            const indicators = document.createElement('div');
            indicators.className = 'swipe-indicators';
            indicators.innerHTML = `
                <div class="swipe-indicator" id="likeIndicator-${uniqueId}">👍</div>
                <div class="swipe-indicator" id="dislikeIndicator-${uniqueId}">👎</div>
            `;
            container.appendChild(indicators);

            let currentCardIndex = 0;
            const responses = [];

            function createCard(text, index) {
                const card = document.createElement('div');
                card.className = 'swipe-card';
                card.innerHTML = `
                    <h3>${text}</h3>
                    <p>Swipe right if you liked it, left if it needs improvement</p>
                `;
                card.style.zIndex = question.cards.length - index;

                let startX = 0;
                let currentX = 0;
                let isDragging = false;

                const handleMouseDown = (e) => {
                    isDragging = true;
                    startX = e.clientX;
                };

                const handleMouseMove = (e) => {
                    if (!isDragging) return;
                    currentX = e.clientX - startX;
                    card.style.transform = `translateX(${currentX}px) rotate(${currentX / 20}deg)`;

                    const likeIndicator = document.getElementById(`likeIndicator-${uniqueId}`);
                    const dislikeIndicator = document.getElementById(`dislikeIndicator-${uniqueId}`);

                    if (currentX > 50) {
                        if (likeIndicator) likeIndicator.classList.add('show');
                        if (dislikeIndicator) dislikeIndicator.classList.remove('show');
                    } else if (currentX < -50) {
                        if (dislikeIndicator) dislikeIndicator.classList.add('show');
                        if (likeIndicator) likeIndicator.classList.remove('show');
                    } else {
                        if (likeIndicator) likeIndicator.classList.remove('show');
                        if (dislikeIndicator) dislikeIndicator.classList.remove('show');
                    }
                };

                const handleMouseUp = () => {
                    if (!isDragging) return;
                    isDragging = false;

                    const likeIndicator = document.getElementById(`likeIndicator-${uniqueId}`);
                    const dislikeIndicator = document.getElementById(`dislikeIndicator-${uniqueId}`);
                    if (likeIndicator) likeIndicator.classList.remove('show');
                    if (dislikeIndicator) dislikeIndicator.classList.remove('show');

                    if (Math.abs(currentX) > 100) {
                        const liked = currentX > 0;
                        responses.push({ topic: text, liked });
                        formResponses.q2_modules = responses; // Save responses
                        card.style.transition = 'transform 0.3s, opacity 0.3s';
                        card.style.transform = `translateX(${currentX > 0 ? 1000 : -1000}px)`;
                        card.style.opacity = '0';

                        // Remove event listeners
                        card.removeEventListener('mousedown', handleMouseDown);
                        document.removeEventListener('mousemove', handleMouseMove);
                        document.removeEventListener('mouseup', handleMouseUp);

                        setTimeout(() => {
                            card.remove();
                            currentCardIndex++;
                            if (currentCardIndex >= question.cards.length) {
                                addPoints(question.points);
                                setTimeout(() => {
                                    showNextButton(parent);
                                }, 300);
                            }
                        }, 300);
                    } else {
                        card.style.transition = 'transform 0.3s';
                        card.style.transform = '';
                        setTimeout(() => {
                            card.style.transition = '';
                        }, 300);
                    }
                };

                card.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);

                return card;
            }

            question.cards.forEach((cardText, index) => {
                container.appendChild(createCard(cardText, index));
            });

            const help = document.createElement('div');
            help.className = 'swipe-help';
            help.textContent = '👆 Click and drag the cards';
            container.appendChild(help);

            parent.appendChild(container);
        }

                { icon: '🚀', text: 'Too Fast', value: 'fast', sliderValue: 5 }
            ];

            function updateSlider(value) {
                const percentage = ((value - 1) / 4) * 100;
                indicator.style.left = percentage + '%';

                // Determine pace label
                let paceLabel = 'Perfect';
                if (value <= 2) {
                    paceLabel = 'Too Slow';
                } else if (value >= 4) {
                    paceLabel = 'Too Fast';
                }
                formResponses.q4_pace = paceLabel; // Save response

                // Update label highlights using our stored references
                Object.values(labelElements).forEach(label => {
                    label.classList.remove('active');
                });

                if (value <= 2) {
                    labelElements['slow'].classList.add('active');
                    indicator.textContent = '🐌';
                } else if (value >= 4) {
                    labelElements['fast'].classList.add('active');
                    indicator.textContent = '🚀';
                } else {
                    labelElements['perfect'].classList.add('active');
                    indicator.textContent = '✅';

                    answered = true;
                    addPoints(question.points);
                    setTimeout(() => {
                        showNextButton(parent);
                    }, 500);

        // Ranking Question
        function createRankingQuestion(parent, question) {
            const container = document.createElement('div');
            container.className = 'ranking-container';

            let draggedItem = null;

            question.items.forEach((item, index) => {
                const rankItem = document.createElement('div');
                rankItem.className = 'rank-item';
                rankItem.draggable = true;
                rankItem.innerHTML = `
                    <div class="rank-number">${index + 1}</div>
                    <div class="rank-label">${item}</div>
                    <div class="drag-handle">⋮⋮</div>
                `;

                rankItem.addEventListener('dragstart', () => {
                    draggedItem = rankItem;
                    rankItem.classList.add('dragging');
                });

                rankItem.addEventListener('dragend', () => {
                    rankItem.classList.remove('dragging');
                });

                rankItem.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(container, e.clientY);
                    if (afterElement == null) {
                        container.appendChild(draggedItem);
                    } else {
                        container.insertBefore(draggedItem, afterElement);
                    }
                    updateRankNumbers();
                });

                container.appendChild(rankItem);
            });

            function getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.rank-item:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            function updateRankNumbers() {
                container.querySelectorAll('.rank-number').forEach((num, index) => {
                    num.textContent = index + 1;
                });
            }

            parent.appendChild(container);

            setTimeout(() => {
                // Save ranking order
                const rankedItems = [];
                container.querySelectorAll('.rank-label').forEach(label => {
                    rankedItems.push(label.textContent);
                });
                formResponses.q5_ranking = rankedItems; // Save response
                
                addPoints(question.points);
                showNextButton(parent);
            }, 5000);
        }
